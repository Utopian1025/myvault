name: 打包安装包

# 手动点 “Run workflow”：打包 Windows + macOS；勾上“发布”就会同时发布新版本
on:
  workflow_dispatch:
    inputs:
      release:
        description: '发布为新版本（GitHub Releases + 国内线路 + 程序内自动更新）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      npm_config_registry: https://registry.npmjs.org
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: 打包 Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - name: 打包 macOS
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --universal --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: 摸鱼动物园-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    # macOS 打包机经常排不上队（GitHub 那边机器不够）：只要 Windows 打好了就照常发布，不让 Mac 拖住整个发布
    if: ${{ !cancelled() && inputs.release }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: 检查至少有 Windows 安装包
        run: |
          ls -R out || true
          if ! ls out/*/*.exe >/dev/null 2>&1; then echo "没有 Windows 安装包，不发布"; exit 1; fi
          ls out/*/*.dmg >/dev/null 2>&1 || echo "::warning::这次 Mac 没打出来（GitHub 的 Mac 打包机没排上），先只发布 Windows"
      - name: 准备发布文件（英文文件名、算 SHA-256、切块）
        run: node scripts/publish.js prepare out
      - name: 发布到 GitHub Releases
        run: |
          V=$(node -p "require('./package.json').version")
          cd release
          ASSETS=$(ls *.exe *.dmg 2>/dev/null || true)
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" $ASSETS --clobber
            gh release edit "v$V" --notes-file notes.md
          else
            gh release create "v$V" $ASSETS --title "摸鱼动物园 v$V" --notes-file notes.md --latest
          fi
      - name: 国内线路：每一块放进单独的 dist-N 分支（jsDelivr 加速）
        run: |
          git config --global user.name "moyu-zoo-bot"
          git config --global user.email "actions@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          echo "{" > refs.json; FIRST=1
          for f in release/parts/*; do
            n=$(basename "$f"); i=${n##*.}; i=$((10#$i))
            d=$(mktemp -d); cp "$f" "$d/"; cd "$d"
            git init -q -b "dist-$i"; git add .; git commit -qm "$n"
            git push -qf "$REMOTE" "dist-$i"
            SHA=$(git rev-parse HEAD); cd - >/dev/null
            [ $FIRST = 1 ] || echo "," >> refs.json; FIRST=0
            echo "\"$n\": \"$SHA\"" >> refs.json
          done
          echo "}" >> refs.json
          cat refs.json
      - name: 写 version.json（程序检查更新用的就是它）
        run: |
          node scripts/publish.js manifest "$(cat refs.json)"
          V=$(node -p "require('./package.json').version")
          git add version.json
          git commit -m "发布 v$V" || echo "没有变化"
          # 打包期间仓库里可能有别的提交（比如其他项目），先接上最新的再推
          for t in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
          # 让 jsDelivr 马上拿到新的版本信息
          # jsDelivr 有时要过一会儿才发现新提交，多刷几次
          for i in 1 2 3 4; do sleep 20; curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/version.json" || true; done
          for p in release/parts/*; do n=$(basename "$p"); done
          echo "完成：v$V"
